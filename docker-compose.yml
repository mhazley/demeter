x-common: &common
  restart: unless-stopped
  environment: &common-env
    PUID: ${PUID}
    PGID: ${PGID}
    UMASK: "002"
    TZ: ${TZ}
 
services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./config/gluetun:/gluetun
    environment:
      TZ: ${TZ}
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${PROTON_WG_PRIVATE_KEY}
      SERVER_COUNTRIES: ${PROTON_SERVER_COUNTRIES}
      # Proton P2P port forwarding (needs a paid plan + NAT-PMP enabled on the WG config)
      VPN_PORT_FORWARDING: "on"
      PORT_FORWARD_ONLY: "on"          # only pick servers that support PF
      # Push the forwarded port into qBittorrent whenever it (re)negotiates.
      # Requires qBit WebUI "Bypass authentication for clients on localhost".
      VPN_PORT_FORWARDING_UP_COMMAND: >-
        /bin/sh -c 'wget -O- -nv --retry-connrefused --post-data
        "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}"
        http://127.0.0.1:8080/api/v2/app/setPreferences'
      # Built-in HTTP proxy so Prowlarr can reach indexers your ISP blocks
      HTTPPROXY: "on"
      HTTPPROXY_LISTENING_ADDRESS: ":8888"
    ports:
      - 8080:8080   # qBittorrent WebUI
      - 9696:9696   # Prowlarr

  qbittorrent:
    <<: *common
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      <<: *common-env
      WEBUI_PORT: "8080"
    volumes:
      - ./config/qbittorrent:/config
      - /data:/data

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    network_mode: service:gluetun   # Cloudflare challenges solved from the VPN exit IP
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info

  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    volumes:
      - ./config/prowlarr:/config

  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    volumes:
      - ./config/sonarr:/config
      - /data:/data
    ports:
      - 8989:8989
 
  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    volumes:
      - ./config/radarr:/config
      - /data:/data
    ports:
      - 7878:7878
