x-common: &common
  restart: unless-stopped
  environment: &common-env
    PUID: ${PUID}
    PGID: ${PGID}
    UMASK: "002"
    TZ: ${TZ}
 
services:
  gluetun:
    image: qmcgaw/gluetun:v3.41.3
    container_name: gluetun
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./config/gluetun:/gluetun
    environment:
      TZ: ${TZ}
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${PROTON_WG_PRIVATE_KEY}
      SERVER_COUNTRIES: ${PROTON_SERVER_COUNTRIES}
      SERVER_CITIES: ${PROTON_SERVER_CITIES}
      # Proton P2P port forwarding (needs a paid plan + NAT-PMP enabled on the WG config)
      VPN_PORT_FORWARDING: "on"
      PORT_FORWARD_ONLY: "on"          # only pick servers that support PF
      # Push the forwarded port into qBittorrent whenever it (re)negotiates.
      # Requires qBit WebUI "Bypass authentication for clients on localhost".
      VPN_PORT_FORWARDING_UP_COMMAND: >-
        /bin/sh -c 'wget -O- -nv --retry-connrefused --post-data
        "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}"
        http://127.0.0.1:8080/api/v2/app/setPreferences'
    ports:
      - 8080:8080   # qBittorrent WebUI
      - 9696:9696   # Prowlarr

  qbittorrent:
    <<: *common
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      <<: *common-env
      WEBUI_PORT: "8080"
    volumes:
      - ./config/qbittorrent:/config
      - /data:/data

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    network_mode: service:gluetun   # Cloudflare challenges solved from the VPN exit IP
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info

  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    volumes:
      - ./config/prowlarr:/config

  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    volumes:
      - ./config/sonarr:/config
      - /data:/data
    ports:
      - 8989:8989
 
  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    volumes:
      - ./config/radarr:/config
      - /data:/data
    ports:
      - 7878:7878

  jellyfin:
    <<: *common
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    volumes:
      - ./config/jellyfin:/config
      - /data/media:/data/media:ro
    devices:
      - /dev/dri:/dev/dri   # Intel UHD 630 -> QSV/VAAPI hardware transcoding
    ports:
      - 8096:8096

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    ports:
      - 5055:5055
    volumes:
      - ./config/seerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    restart: unless-stopped

  homepage:
    image: ghcr.io/gethomepage/homepage:latest   # pin a release tag once it works
    container_name: homepage
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      # Every hostname:port you'll open it on. Requests with any other Host header are rejected.
      HOMEPAGE_ALLOWED_HOSTS: matt-server.taila090da.ts.net:3000,server.matthazley.com:3000
      # Secrets come from .env and are substituted into services.yaml as {{HOMEPAGE_VAR_...}}
      HOMEPAGE_VAR_SONARR_KEY: ${SONARR_API_KEY}
      HOMEPAGE_VAR_RADARR_KEY: ${RADARR_API_KEY}
      HOMEPAGE_VAR_PROWLARR_KEY: ${PROWLARR_API_KEY}
      HOMEPAGE_VAR_JELLYFIN_KEY: ${JELLYFIN_API_KEY}
      HOMEPAGE_VAR_SEERR_KEY: ${SEERR_API_KEY}
      HOMEPAGE_VAR_QBIT_USER: ${QBIT_USER}
      HOMEPAGE_VAR_QBIT_PASS: ${QBIT_PASS}
      HOMEPAGE_VAR_GLUETUN_KEY: ${GLUETUN_CONTROL_KEY}
    volumes:
      - ./config/homepage:/app/config
      - /data:/app/data:ro      # only so the disk widget can report NVMe usage
    ports:
      - 3000:3000
    depends_on: [socket-proxy]

  # Read-only, filtered Docker API so Homepage can show container status
  # without getting the raw docker socket (which is root on the host).
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
